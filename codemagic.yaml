workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: LuckyTenAPI    # integrations 위치 (environment 안에 넣으면 오류!)
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nanoset.aiCanaanChurch
      vars:
        BUNDLE_ID: "com.nanoset.aiCanaanChurch"

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install              # Podfile.lock 동기화 (없으면 sandbox 오류!)
        script: |
          cd ios
          pod install

      - name: Xcode 서명 설정 적용       # 없으면 "No valid code signing" 오류!
        script: xcode-project use-profiles

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
        # --export-options-plist 없으면 "No artifacts were found" 오류!

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true       # true 로 설정해야 자동 업로드
        submit_to_app_store: false
        # app_apple_id 필드 넣으면 validation 오류! 넣지 말 것
