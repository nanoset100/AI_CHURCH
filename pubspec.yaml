name: ai_canaan_church
description: 가나안 성도를 위한 말씀 묵상 앱 - 극동방송 AI 설교 요약으로 혼자 예배드려요
publish_to: 'none'
version: 2.2.0+13

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.3.0
  share_plus: ^10.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
